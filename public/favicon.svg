<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />

  <!-- Background Cinema Reel Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="8" stroke-dasharray="16 16" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Animated Stickman Hero -->
  <g filter="url(#neonGlow)">
    <!-- Head -->
    <circle cx="256" cy="145" r="42" fill="none" stroke="url(#stickGrad)" stroke-width="18" />
    <!-- Dynamic Body Line -->
    <path d="M 256 187 L 256 310" stroke="url(#stickGrad)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Hero Pose Arms (Martial / Film Director pose) -->
    <!-- Left Arm holding Magic Wand / Lightning -->
    <path d="M 256 220 L 175 180 L 130 140" stroke="url(#stickGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Arm pointing forward -->
    <path d="M 256 220 L 330 250 L 390 220" stroke="url(#stickGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Action Legs -->
    <path d="M 256 310 L 195 385 L 140 440" stroke="url(#stickGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 256 310 L 320 380 L 375 435" stroke="url(#stickGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Speech Bubble (Talk Element) -->
  <g transform="translate(320, 90)">
    <path d="M 0 20 C 0 8.954 8.954 0 20 0 L 110 0 C 121.046 0 130 8.954 130 20 L 130 65 C 130 76.046 121.046 85 110 85 L 35 85 L 10 105 L 18 85 C 8 85 0 76 0 65 Z" fill="#ffffff" />
    <circle cx="45" cy="42" r="7" fill="#2563eb" />
    <circle cx="65" cy="42" r="7" fill="#3b82f6" />
    <circle cx="85" cy="42" r="7" fill="#60a5fa" />
  </g>

  <!-- Sparkle & Magic Effects (AI Spark) -->
  <g transform="translate(100, 100)">
    <polygon points="20,0 25,15 40,20 25,25 20,40 15,25 0,20 15,15" fill="url(#accentGrad)" />
  </g>
  <g transform="translate(380, 240)">
    <polygon points="15,0 19,11 30,15 19,19 15,30 11,19 0,15 11,11" fill="url(#accentGrad)" />
  </g>
  <g transform="translate(160, 270)">
    <polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9" fill="#38bdf8" />
  </g>
</svg>
